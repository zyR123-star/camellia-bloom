<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#040b08" />
<title>白山茶 · 手控绽放</title>
<meta name="description" content="用摄像头识别手势：握拳花苞闭合，张开手掌，白山茶在指尖一层层绽放。" />
<link rel="stylesheet" href="./styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="stage" class="stage">
  <canvas id="gl-layer" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-cn">白山茶</span>
    <span class="brand-sep"></span>
    <span class="brand-en">CAMELLIA · HAND BLOOM</span>
  </div>
  <div class="tools">
    <button id="btn-pip" class="tool" type="button" aria-pressed="true" title="显示/隐藏手部捕捉小窗（C）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="9" cy="11" r="2" /><path d="M3 17l5-4 4 3 3-2 6 4" /></svg>
      <span>捕捉</span>
    </button>
    <button id="btn-skeleton" class="tool" type="button" aria-pressed="true" title="显示/隐藏小窗里的手部骨架（H）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9m4 11V5m4 15v-9m4 9V7m4 13v-6" /></svg>
      <span>骨架</span>
    </button>
    <button id="btn-help" class="tool tool-icon" type="button" aria-label="操作说明" title="操作说明（?）">?</button>
  </div>
</header>

<section class="intro" id="intro">
  <div class="intro-glow" aria-hidden="true"></div>
  <div class="intro-inner">
    <p class="kicker">实时手部识别 · 21 关键点</p>
    <h1>指尖之上<br /><em>白山茶</em></h1>
    <p class="lede">
      握拳，花收成一枚苞；<br />
      张开手掌，花瓣便一层一层散开。
    </p>
    <div class="actions">
      <button id="btn-start" class="btn btn-primary" type="button">
        <span>开启摄像头</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.6" /></svg>
      </button>
      <button id="btn-demo" class="btn btn-ghost" type="button">先看演示</button>
    </div>
    <p class="fineprint" id="intro-note">画面仅在本机处理，不会上传任何数据</p>
  </div>
</section>

<aside class="hud" id="hud" aria-live="polite">
  <div class="hud-top">
    <span class="hud-dot" id="hud-dot"></span>
    <span class="hud-state" id="state-label">花苞</span>
    <span class="hud-mode" id="mode-label">待机</span>
  </div>
  <div class="meter"><i id="meter-fill"></i></div>
  <div class="hud-nums">
    <span><em>tension</em><b id="num-tension">0.00</b></span>
    <span><em>spread</em><b id="num-spread">0.00</b></span>
  </div>
</aside>

<div class="hint" id="hint"><span>举起手 · 掌心朝向摄像头</span></div>

<aside class="pip" id="pip" aria-label="实时手部捕捉画面">
  <div class="pip-head">
    <i class="pip-dot" id="pip-dot"></i>
    <span class="pip-title">手部捕捉</span>
    <em id="pip-state">待机</em>
  </div>
  <div class="pip-body">
    <canvas id="pip-canvas"></canvas>
  </div>
  <div class="pip-foot">
    <span class="pip-bar"><i id="pip-fill"></i></span>
    <b id="pip-num">0.00</b>
  </div>
</aside>

<div class="help" id="help" role="dialog" aria-label="操作说明" aria-hidden="true">
  <div class="help-card">
    <h2>怎么玩</h2>
    <ul>
      <li><b>张开手掌</b><span>花瓣向外散开，进入盛放</span></li>
      <li><b>握拳</b><span>花瓣收拢，合回花苞</span></li>
      <li><b>移动手掌</b><span>花朵跟着手走，指尖会拨动花瓣</span></li>
      <li><kbd>C</kbd><span>显示 / 隐藏右下角手部捕捉画面</span></li>
      <li><kbd>H</kbd><span>显示 / 隐藏小窗里的手部骨架</span></li>
      <li><kbd>空格</kbd><span>切换自动演示（呼吸）</span></li>
    </ul>
    <button class="btn btn-ghost" id="btn-help-close" type="button">知道了</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
